name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fleetpulse
          POSTGRES_PASSWORD: fleetpulse
          POSTGRES_DB: fleetpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetpulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://fleetpulse:fleetpulse@localhost:5432/fleetpulse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest

  build-deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/beharhyseni/fleetpulse:${{ github.sha }}
            ghcr.io/beharhyseni/fleetpulse:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NODE_IP }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            sudo k3s kubectl -n fleetpulse set image deployment/fleetpulse-api \
              api=ghcr.io/beharhyseni/fleetpulse:${{ github.sha }}
            sudo k3s kubectl -n fleetpulse rollout status deployment/fleetpulse-api --timeout=180s
