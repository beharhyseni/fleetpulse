[project]
name = "fleetpulse"
version = "0.1.0"
description = "Real-time event monitoring with a grounded LLM copilot and a tool-using ops agent; demo domain: IoT device fleet."
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
explicit_package_bases = true
warn_unused_ignores = true

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "--cov=app --cov-fail-under=75"
testpaths = ["tests"]
