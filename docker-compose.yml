services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fleetpulse
      POSTGRES_PASSWORD: fleetpulse
      POSTGRES_DB: fleetpulse
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetpulse"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
